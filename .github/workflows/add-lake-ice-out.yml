name: Add lake ice-out to national tools

on:
  push:
    branches:
      - add-lake-ice-out
    paths:
      - .github/workflows/add-lake-ice-out.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-lake-ice-out
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch national tools landing page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('public/national-tools/index.html')
          s = path.read_text()

          replacements = [
            (
              'Free U.S. outdoor tools for smoke and air quality, aurora, rivers, coastal water, Niagara Falls rainbow planning, snowpack, White Christmas odds, frost, planting, garden watering and fall color. Open the specialist tool for the decision you are making.',
              'Free U.S. outdoor tools for smoke and air quality, aurora, rivers, coastal water, Niagara Falls rainbow planning, lake ice-out, snowpack, White Christmas odds, frost, planting, garden watering and fall color. Open the specialist tool for the decision you are making.'
            ),
            (
              'A national library of practical outdoor decision tools for rivers, coasts, Niagara Falls rainbows, snow, gardens, aurora and seasonal conditions.',
              'A national library of practical outdoor decision tools for rivers, coasts, Niagara Falls rainbows, lake ice-out, snow, gardens, aurora and seasonal conditions.'
            ),
            ('\"dateModified\":\"2026-09-06\"', '\"dateModified\":\"2026-09-07\"'),
            ('\"numberOfItems\":11', '\"numberOfItems\":12'),
            (
              '{\"@type\":\"ListItem\",\"position\":11,\"url\":\"https://chrisizworski.com/national-tools/niagara-rainbow/\",\"name\":\"Niagara Falls Rainbow Predictor\"}',
              '{\"@type\":\"ListItem\",\"position\":11,\"url\":\"https://chrisizworski.com/national-tools/niagara-rainbow/\",\"name\":\"Niagara Falls Rainbow Predictor\"},\n        {\"@type\":\"ListItem\",\"position\":12,\"url\":\"https://lspp-ice-out.vercel.app/north-america/\",\"name\":\"Lake Ice-Out Forecast\"}'
            ),
            (
              'snowpack, aurora, or fall color.',
              'lake ice-out, snowpack, aurora, or fall color.'
            ),
            (
              '<article class=\"intent-card\"><div class=\"intent-kicker\">Winter</div><h3>Understand snow on the ground and what comes next</h3><ul><li><a href=\"/national-tools/snow/\">Check snowpack and melt<span>Measured snow depth and SWE plus melt/refreeze weather</span></a></li><li><a href=\"/national-tools/white-christmas/\">Check White Christmas odds<span>Historical snow cover blended with the signals that matter as December 25 gets closer</span></a></li></ul></article>',
              '<article class=\"intent-card\"><div class=\"intent-kicker\">Winter</div><h3>Understand snow, lake ice-out and what comes next</h3><ul><li><a href=\"https://lspp-ice-out.vercel.app/north-america/\">Check lake ice-out<span>Current seasonal state plus a calibrated spring ice-out outlook for northern U.S. and Canadian lakes</span></a></li><li><a href=\"/national-tools/snow/\">Check snowpack and melt<span>Measured snow depth and SWE plus melt/refreeze weather</span></a></li><li><a href=\"/national-tools/white-christmas/\">Check White Christmas odds<span>Historical snow cover blended with the signals that matter as December 25 gets closer</span></a></li></ul></article>'
            ),
            (
              '<article class=\"feature-card\" data-tags=\"winter snow skiing mountains water\" data-months=\"1,2,3,4,5,11,12\"><div class=\"feature-kicker\">Snowpack &amp; melt</div><h3><a href=\"/national-tools/snow/\">Snowpack &amp; Snowmelt Conditions</a></h3><p>See measured snow depth and snow-water equivalent near a location, recent pack change, and the short-term weather pattern that can drive melt, refreeze or new snow.</p><div class=\"signal-line\">Measured snowpack + NWS weather pattern</div><a class=\"tool-cta\" href=\"/national-tools/snow/\">Check snowpack &rarr;</a></article>',
              '<article class=\"feature-card\" data-tags=\"winter snow skiing mountains water\" data-months=\"1,2,3,4,5,11,12\"><div class=\"feature-kicker\">Snowpack &amp; melt</div><h3><a href=\"/national-tools/snow/\">Snowpack &amp; Snowmelt Conditions</a></h3><p>See measured snow depth and snow-water equivalent near a location, recent pack change, and the short-term weather pattern that can drive melt, refreeze or new snow.</p><div class=\"signal-line\">Measured snowpack + NWS weather pattern</div><a class=\"tool-cta\" href=\"/national-tools/snow/\">Check snowpack &rarr;</a></article>\n<article class=\"feature-card\" data-tags=\"winter lake ice ice-out thaw open water boating fishing canada north america\" data-months=\"1,2,3,4,5,6,7,8,9\"><div class=\"feature-kicker\">Lake ice · U.S. + Canada</div><h3><a href=\"https://lspp-ice-out.vercel.app/north-america/\">Lake Ice-Out Forecast</a></h3><p>Search northern U.S. and Canadian lakes for today\'s seasonal state, calibrated spring ice-out timing, historical context, live thaw signals and satellite imagery.</p><div class=\"signal-line\">Lake history + seasonal thaw physics + live weather + NASA imagery</div><a class=\"tool-cta\" href=\"https://lspp-ice-out.vercel.app/north-america/\">Check a lake &rarr;</a></article>'
            ),
            (
              'placeholder=\"Search tools, for example Niagara, river, snow, frost, beach, aurora\"',
              'placeholder=\"Search tools, for example Niagara, river, lake ice, snow, frost, beach, aurora\"'
            ),
            (
              '<section class=\"library-group\" data-library-group=\"winter\"><h2>Snow and winter tools</h2><p class=\"group-blurb\">Measured snowpack and seasonal Christmas snow probability are different decisions, so they remain separate tools.</p><div class=\"tool-grid\"><article class=\"tool-card\" data-search-card data-tags=\"winter snow skiing mountains water\" data-months=\"1,2,3,4,5,11,12\"><div class=\"tk\">Live data<span class=\"tk-season\" hidden> / in season now</span></div><div class=\"tool-title\"><a href=\"/national-tools/snow/\">Snowpack and Snowmelt Conditions</a></div><div class=\"tool-desc\">Measured snow depth, SWE, recent pack change and the next melt/refreeze weather pattern.</div></article><article class=\"tool-card\" data-search-card data-tags=\"winter snow christmas seasonal travel\" data-months=\"10,11,12\"><div class=\"tk\">Seasonal tool<span class=\"tk-season\" hidden> / in season now</span></div><div class=\"tool-title\"><a href=\"/national-tools/white-christmas/\">White Christmas Odds</a></div><div class=\"tool-desc\">Christmas snow-cover history blended with seasonal and short-range signals at the appropriate lead time.</div></article></div></section>',
              '<section class=\"library-group\" data-library-group=\"winter\"><h2>Snow, lake ice and winter tools</h2><p class=\"group-blurb\">Lake ice-out, measured snowpack and seasonal Christmas snow probability answer different decisions, so they remain separate tools.</p><div class=\"tool-grid\"><article class=\"tool-card\" data-search-card data-tags=\"winter lake ice ice-out thaw open water boating fishing canada north america\" data-months=\"1,2,3,4,5,6,7,8,9\"><div class=\"tk\">Seasonal lake tool<span class=\"tk-season\" hidden> / in season now</span></div><div class=\"tool-title\"><a href=\"https://lspp-ice-out.vercel.app/north-america/\">Lake Ice-Out Forecast</a></div><div class=\"tool-desc\">Current lake-season state, calibrated spring ice-out timing, historical context, live thaw signals and NASA satellite imagery for northern U.S. and Canadian lakes.</div></article><article class=\"tool-card\" data-search-card data-tags=\"winter snow skiing mountains water\" data-months=\"1,2,3,4,5,11,12\"><div class=\"tk\">Live data<span class=\"tk-season\" hidden> / in season now</span></div><div class=\"tool-title\"><a href=\"/national-tools/snow/\">Snowpack and Snowmelt Conditions</a></div><div class=\"tool-desc\">Measured snow depth, SWE, recent pack change and the next melt/refreeze weather pattern.</div></article><article class=\"tool-card\" data-search-card data-tags=\"winter snow christmas seasonal travel\" data-months=\"10,11,12\"><div class=\"tk\">Seasonal tool<span class=\"tk-season\" hidden> / in season now</span></div><div class=\"tool-title\"><a href=\"/national-tools/white-christmas/\">White Christmas Odds</a></div><div class=\"tool-desc\">Christmas snow-cover history blended with seasonal and short-range signals at the appropriate lead time.</div></article></div></section>'
            ),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'missing replacement anchor: {old[:100]}')
              s = s.replace(old, new, 1)

          if s.count('https://lspp-ice-out.vercel.app/north-america/') < 4:
              raise SystemExit('ice-out link did not land in all intended surfaces')
          if '\"numberOfItems\":12' not in s:
              raise SystemExit('structured ItemList count not updated')

          path.write_text(s)
          PY
      - name: Run hub tests
        run: npm test
      - name: Commit page change
        shell: bash
        run: |
          if git diff --quiet -- public/national-tools/index.html; then
            echo "No page changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/national-tools/index.html
          git commit -m "Add Lake Ice-Out Forecast to national tools"
          git push origin HEAD:add-lake-ice-out
