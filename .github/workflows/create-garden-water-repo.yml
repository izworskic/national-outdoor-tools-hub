name: Create garden water repo bridge

on:
  push:
    paths:
      - '.github/workflows/create-garden-water-repo.yml'

permissions:
  contents: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate one-time key and publish public key
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/gw-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/gw-private.pem -pubout -out /tmp/gw-public.pem >/dev/null 2>&1
          mkdir -p .github/bridge
          cp /tmp/gw-public.pem .github/bridge/garden-water-public.pem
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/bridge/garden-water-public.pem
          git commit -m 'Publish one-time garden water bridge key'
          git push origin HEAD:main
      - name: Wait for encrypted token and create repository
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for i in $(seq 1 120); do
            git fetch origin main --quiet
            if git show origin/main:.github/bridge/garden-water-token.enc >/tmp/gw-token.b64 2>/dev/null; then
              found=1
              break
            fi
            sleep 3
          done
          if [ "$found" -ne 1 ]; then
            echo 'Encrypted token was not supplied in time.' >&2
            exit 1
          fi
          base64 -d /tmp/gw-token.b64 >/tmp/gw-token.bin
          TOKEN="$(openssl pkeyutl -decrypt -inkey /tmp/gw-private.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in /tmp/gw-token.bin)"
          status="$(curl -sS -o /tmp/gw-create.json -w '%{http_code}' \
            -X POST https://api.github.com/user/repos \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -d '{"name":"national-garden-water","description":"National garden watering decision intelligence using weather, evapotranspiration, soil, crop stage and gardener inputs","private":false,"auto_init":true}')"
          unset TOKEN
          if [ "$status" != '201' ] && [ "$status" != '422' ]; then
            cat /tmp/gw-create.json >&2
            exit 1
          fi
          echo "GitHub repository create status: ${status}"
