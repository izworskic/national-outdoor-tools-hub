name: Verify team-scoped hub deployment
on:
  push:
    branches: [verify-hub-production]
    paths: [.github/workflows/verify-team-alias.yml]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed national tools hub
        shell: bash
        run: |
          set -euo pipefail
          url='https://national-outdoor-tools-hub-izworski-gmailcoms-projects.vercel.app/national-tools/'
          code=$(curl -L -sS -o /tmp/hub.html -w '%{http_code}' "$url")
          echo "status=$code bytes=$(wc -c </tmp/hub.html)"
          test "$code" = "200"
          for marker in 'Lake Ice-Out Forecast' 'https://lspp-ice-out.vercel.app/north-america/' '"numberOfItems":12' 'G-Y5D2V2W7HN'; do
            if grep -Fq "$marker" /tmp/hub.html; then echo "FOUND $marker"; else echo "MISSING $marker"; fi
          done
          echo '--- title/meta excerpt ---'
          grep -Eo '<title>[^<]+|numberOfItems[^,}]+' /tmp/hub.html | head -10 || true
          echo '--- lake matches ---'
          grep -Eo '.{0,50}(Lake Ice-Out|lake ice-out|lspp-ice-out).{0,100}' /tmp/hub.html | head -20 || true
