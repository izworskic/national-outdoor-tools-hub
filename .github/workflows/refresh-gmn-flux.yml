name: Refresh GMN published optical flux CSV
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import verified GMN optical-flux CSV files
        run: node scripts/refresh-gmn-flux.mjs
      - name: Save validated snapshot, if changed
        run: |
          if ! git diff --quiet -- data/gmn-observed-flux.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/gmn-observed-flux.json
            git commit -m "data: refresh validated GMN meteor flux observations"
            git push
          fi
