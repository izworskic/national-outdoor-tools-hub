name: Verify repository

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Smoke test Yosemite Firefall engine
        run: node scripts/verify-yosemite-engine.mjs
      - name: Run production Vercel build pipeline
        run: npm run vercel-build
